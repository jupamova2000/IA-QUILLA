<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Ficha de Proyecto</title>
    <!-- SheetJS para lectura de Excel en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            /* Paleta institucional */
            --primary-color: #39A900; 
            --secondary-color: #00324D;
            --bg-color: #f4f6f8;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* UI de Carga */
        .upload-card {
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border: 2px dashed #ccc;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-card.dragover {
            border-color: var(--primary-color);
            background-color: #f0faf0;
        }

        .upload-card input[type="file"] { display: none; }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover { background-color: #2d8500; }
        .btn-outline { background-color: white; color: var(--secondary-color); border: 1px solid var(--secondary-color); }
        .btn-outline:hover { background-color: #f0f0f0; }

        .error-msg {
            color: #d32f2f;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            padding: 10px;
            border-radius: 4px;
            background: #ffebee;
        }

        /* Ficha Visual */
        .ficha-visor {
            display: none;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .ficha-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .ficha-header h1 { margin: 0; color: var(--secondary-color); font-size: 1.8rem; line-height: 1.2; width: 80%;}

        .section-title {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .data-field {
            margin-bottom: 15px;
        }

        .data-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .data-field .value {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            min-height: 44px;
            word-wrap: break-word;
            font-size: 1rem;
        }

        .full-width { grid-column: 1 / -1; }

        /* Estilos de Impresión */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .container { max-width: 100%; margin: 0; }
            .ficha-visor { box-shadow: none; padding: 0; border-radius: 0; display: block; }
            .data-field .value { border: 1px solid #ccc; break-inside: avoid; }
            .grid-2, .grid-3 { gap: 10px; }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .ficha-header { flex-direction: column; gap: 15px; }
            .ficha-header h1 { width: 100%; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zona de Carga -->
        <div class="upload-card no-print" id="drop-zone">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <h2>Cargar Ficha de Proyecto</h2>
            <p style="color: #666; margin-bottom: 20px;">Arrastra la plantilla Excel (.xlsx) aquí o selecciona el archivo</p>
            
            <label for="file-upload" class="btn">Seleccionar Archivo</label>
            <input type="file" id="file-upload" accept=".xlsx, .xls">
            
            <div id="error-msg" class="error-msg"></div>
        </div>

        <!-- Ficha Visual -->
        <div class="ficha-visor" id="ficha-container">
            <div class="ficha-header">
                <h1 id="f-titulo">Título del Proyecto</h1>
                <div class="no-print">
                    <button class="btn btn-outline" onclick="location.reload()" style="margin-right: 10px;">Cargar Otro</button>
                    <button class="btn" onclick="window.print()">Imprimir / PDF</button>
                </div>
            </div>

            <!-- 1. Identificación -->
            <div class="section-title">Identificación</div>
            <div class="grid-2">
                <div class="data-field"><label>Código</label><div class="value" id="f-codigo"></div></div>
                <div class="data-field"><label>Área Temática</label><div class="value" id="f-area"></div></div>
                <div class="data-field"><label>Tipo de Investigación</label><div class="value" id="f-tipo"></div></div>
                <div class="data-field"><label>Responsable</label><div class="value" id="f-responsable"></div></div>
                <div class="data-field"><label>Población Objetivo</label><div class="value" id="f-poblacion"></div></div>
                <div class="data-field"><label>Lugar</label><div class="value" id="f-lugar"></div></div>
                <div class="data-field"><label>Año</label><div class="value" id="f-anio"></div></div>
            </div>

            <!-- 2. Planteamiento -->
            <div class="section-title" style="margin-top: 25px;">Planteamiento</div>
            <div class="grid-1">
                <div class="data-field"><label>Problema Identificado</label><div class="value" id="f-problema"></div></div>
                <div class="data-field"><label>Pregunta de Investigación</label><div class="value" id="f-pregunta"></div></div>
            </div>

            <!-- 3. Objetivos -->
            <div class="section-title" style="margin-top: 25px;">Objetivos</div>
            <div class="grid-1">
                <div class="data-field"><label>Objetivo General</label><div class="value" id="f-obj-gen"></div></div>
                <div class="data-field"><label>Objetivo Específico 1</label><div class="value" id="f-obj-esp1"></div></div>
                <div class="data-field"><label>Objetivo Específico 2</label><div class="value" id="f-obj-esp2"></div></div>
                <div class="data-field"><label>Objetivo Específico 3</label><div class="value" id="f-obj-esp3"></div></div>
            </div>

            <!-- 4. Metodología -->
            <div class="section-title" style="margin-top: 25px;">Metodología</div>
            <div class="grid-2">
                <div class="data-field full-width"><label>Metodología</label><div class="value" id="f-metodologia"></div></div>
                <div class="data-field full-width"><label>Contexto / Muestra</label><div class="value" id="f-muestra"></div></div>
            </div>

            <!-- 5. Resultados y Seguimiento -->
            <div class="section-title" style="margin-top: 25px;">Resultados y Seguimiento</div>
            <div class="grid-3">
                <div class="data-field"><label>Producto Esperado</label><div class="value" id="f-producto"></div></div>
                <div class="data-field"><label>Duración Estimada</label><div class="value" id="f-duracion"></div></div>
                <div class="data-field"><label>Estado</label><div class="value" id="f-estado"></div></div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-upload');
        const dropZone = document.getElementById('drop-zone');
        const errorMsg = document.getElementById('error-msg');
        const fichaContainer = document.getElementById('ficha-container');

        // Eventos Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) procesarArchivo(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) procesarArchivo(e.target.files[0]);
        });

        function procesarArchivo(file) {
            errorMsg.style.display = 'none';

            // Validar extensión
            if (!file.name.match(/\.(xlsx|xls)$/)) {
                mostrarError('Por favor, sube un archivo Excel válido (.xlsx o .xls)');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Validación de hoja
                    if (!workbook.SheetNames.includes('FichaProyecto')) {
                        throw new Error("Estructura inválida. No se encontró la hoja 'FichaProyecto'.");
                    }

                    const sheet = workbook.Sheets['FichaProyecto'];
                    
                    // Función segura para extraer datos por posición
                    const leerCelda = (celda) => sheet[celda] ? sheet[celda].v : 'N/A';

                    // Mapeo de datos al DOM
                    document.getElementById('f-codigo').innerText = leerCelda('C5');
                    document.getElementById('f-titulo').innerText = leerCelda('C6');
                    document.getElementById('f-tipo').innerText = leerCelda('C7');
                    document.getElementById('f-area').innerText = leerCelda('C8');
                    document.getElementById('f-lugar').innerText = leerCelda('C9');
                    document.getElementById('f-responsable').innerText = leerCelda('C10');
                    document.getElementById('f-poblacion').innerText = leerCelda('C11');
                    document.getElementById('f-anio').innerText = leerCelda('C12');

                    document.getElementById('f-problema').innerText = leerCelda('C15');
                    document.getElementById('f-pregunta').innerText = leerCelda('C16');

                    document.getElementById('f-obj-gen').innerText = leerCelda('C19');
                    document.getElementById('f-obj-esp1').innerText = leerCelda('C20');
                    document.getElementById('f-obj-esp2').innerText = leerCelda('C21');
                    document.getElementById('f-obj-esp3').innerText = leerCelda('C22');

                    document.getElementById('f-metodologia').innerText = leerCelda('C25');
                    document.getElementById('f-muestra').innerText = leerCelda('C26');

                    document.getElementById('f-producto').innerText = leerCelda('C29');
                    document.getElementById('f-duracion').innerText = leerCelda('C30');
                    document.getElementById('f-estado').innerText = leerCelda('C31');

                    // Cambiar vista
                    dropZone.style.display = 'none';
                    fichaContainer.style.display = 'block';

                } catch (error) {
                    mostrarError(error.message);
                }
            };
            
            reader.onerror = () => mostrarError("Hubo un error al leer el archivo.");
            reader.readAsArrayBuffer(file);
        }

        function mostrarError(mensaje) {
            errorMsg.innerText = mensaje;
            errorMsg.style.display = 'block';
            fileInput.value = ''; 
        }
    </script>
</body>
</html>
